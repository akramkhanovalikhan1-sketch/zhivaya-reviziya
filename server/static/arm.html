<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>АРМ руководителя ревизии</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --line: #2a3544;
      --text: #e8eef6;
      --muted: #8b9cb3;
      --gray: #6b7280;
      --yellow: #eab308;
      --green: #22c55e;
      --orange: #f97316;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 16px 24px; border-bottom: 1px solid var(--line); background: #12181f;
      position: sticky; top: 0; z-index: 2; flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 650; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 650; cursor: pointer; color: #fff; }
    .btn-final { background: #16a34a; }
    .btn-final:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    .btn-ghost { background: #334155; }
    .btn-sale { background: #2563eb; }
    main { padding: 20px 24px 48px; display: grid; gap: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .zone { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; border-left: 6px solid var(--gray); }
    .zone.gray { border-left-color: var(--gray); }
    .zone.yellow { border-left-color: var(--yellow); }
    .zone.green { border-left-color: var(--green); }
    .zone.orange { border-left-color: var(--orange); }
    .zone b { display: block; margin-bottom: 4px; }
    .zone span { color: var(--muted); font-size: 12px; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); font-size: 13px; }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
    th { color: var(--muted); font-weight: 600; background: #151c24; }
    .neg { color: #f87171; }
    .pos { color: #4ade80; }
    .warn, .okbox { border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .warn { background: #3b2a12; border: 1px solid #854d0e; }
    .okbox { background: #14532d; border: 1px solid #166534; }
    .link { background: transparent; color: #93c5fd; padding: 0; font-weight: 600; }
    .banner { background: #1e3a5f; border: 1px solid #1d4ed8; border-radius: 10px; padding: 10px 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Живая ревизия — АРМ товароведа</h1>
      <div class="sub" id="meta">Загрузка…</div>
    </div>
    <div class="actions">
      <button class="btn-sale" onclick="sale('DRL-18')">Пробить дрель на кассе</button>
      <button class="btn-sale" onclick="sale('SCR-35')">Пробить саморез</button>
      <button class="btn-ghost" onclick="applyOffset()">Автозачет пересортицы</button>
      <button class="btn-ghost" onclick="resetDemo()">Сбросить демо</button>
      <button class="btn-final" id="finalBtn" disabled>Сформировать финальные акты ревизии</button>
    </div>
  </header>
  <main>
    <div id="banners"></div>
    <section>
      <div class="legend" style="margin-bottom:12px">
        <span><i class="dot" style="background:#6b7280"></i>Серый — не подходили</span>
        <span><i class="dot" style="background:#eab308"></i>Жёлтый — считают сейчас</span>
        <span><i class="dot" style="background:#22c55e"></i>Зелёный — зона закрыта</span>
        <span><i class="dot" style="background:#f97316"></i>Оранжевый — перепроверка</span>
      </div>
      <div class="grid" id="zones"></div>
    </section>
    <section>
      <h2>Сводная таблица (онлайн)</h2>
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Товар</th>
            <th>План на старт зоны</th>
            <th>Факт ТСД</th>
            <th>Продано после Старта</th>
            <th>Итоговый факт</th>
            <th>Отклонение</th>
          </tr>
        </thead>
        <tbody id="lines"></tbody>
      </table>
    </section>
    <section id="extra"></section>
  </main>
  <script>
    const API = "/hs/tsd/arm";

    async function load() {
      const d = await fetch(API + "/dashboard").then(r => r.json());
      const closed = d.zones.filter(z => !z.quarantine && z.status === "closed").length;
      const work = d.zones.filter(z => !z.quarantine).length;
      document.getElementById("meta").textContent =
        `Покрытие ${d.coveragePercent}%  ·  ${closed}/${work} зон закрыто` +
        (d.finalized ? "  ·  акты сформированы" : "");
      const btn = document.getElementById("finalBtn");
      btn.disabled = !d.canFinalize;
      btn.onclick = finalize;

      document.getElementById("zones").innerHTML = d.zones.map(z => `
        <div class="zone ${z.color}">
          <b>${z.zoneId}${z.quarantine ? " · cut-off" : ""}</b>
          <span>${z.name}</span><br>
          <span>${z.userName || "—"}${z.sessionNum ? " · сессия " + z.sessionNum : ""}</span>
          ${z.status === "closed" && !d.finalized ? `<br><button class="link" onclick="recheck('${z.zoneId}')">Направить на перепроверку</button>` : ""}
        </div>
      `).join("");

      document.getElementById("lines").innerHTML = d.lines.map(r => `
        <tr>
          <td>${r.sku}</td>
          <td>${r.name}</td>
          <td>${r.plan}</td>
          <td>${r.factTsd}</td>
          <td>${r.soldAfterStart}</td>
          <td>${r.adjustedFact}</td>
          <td class="${r.deviation < 0 ? "neg" : r.deviation > 0 ? "pos" : ""}">${r.deviation}</td>
        </tr>
      `).join("");

      let banners = "";
      if (d.freezes.length) {
        banners += d.freezes.map(f => `<div class="banner">Заморозка кассы: ${f.name} до ${f.until}</div>`).join("");
      }
      document.getElementById("banners").innerHTML = banners;

      let extra = "";
      if (d.autoOffset.length) {
        extra += "<h2>Автозачет (одинаковая цена и группа)</h2>";
        extra += d.autoOffset.map(c => `<div class="okbox">${c.a} ↔ ${c.b} · ${c.qty} шт · ${c.reason}</div>`).join("");
      }
      if (d.candidates.length) {
        extra += "<h2>Кандидаты на пересортицу (ручной клик)</h2>";
        extra += d.candidates.map(c => `<div class="warn">${c.a} ↔ ${c.b} · ${c.qty} шт · ${c.reason}</div>`).join("");
      }
      if (d.transitWarnings.length) {
        extra += "<h2>Предупреждения РЦ</h2>";
        extra += d.transitWarnings.map(t => {
          const btn = t.action === "post"
            ? ` <button class="link" onclick="postTransit('${t.id}')">Провести</button>`
            : "";
          return `<div class="warn">${t.message}${btn}</div>`;
        }).join("");
      }
      if (d.comparison.length) {
        extra += "<h2>Сравнение первичного и повторного подсчета</h2><table><thead><tr><th>Зона</th><th>Товар</th><th>1-я сессия</th><th>2-я сессия</th><th>Δ</th></tr></thead><tbody>";
        extra += d.comparison.map(r => `
          <tr>
            <td>${r.zoneId}</td>
            <td>${r.name}</td>
            <td>${r.firstUser}: ${r.firstQty}</td>
            <td>${r.secondUser}: ${r.secondQty}</td>
            <td class="${r.delta < 0 ? "neg" : r.delta > 0 ? "pos" : ""}">${r.delta}</td>
          </tr>`).join("");
        extra += "</tbody></table>";
      }
      if (d.acts && d.acts.length) {
        extra += "<h2>Финальные акты</h2>";
        extra += d.acts.map(a => `<div class="okbox">${a.kind}: ${a.name} · ${a.qty} шт</div>`).join("");
      }
      if (d.sales && d.sales.length) {
        extra += "<h2>Последние чеки ККМ</h2>";
        extra += d.sales.map(s => `<div class="banner">${s.time} · ${s.name} × ${s.qty}</div>`).join("");
      }
      document.getElementById("extra").innerHTML = extra;
    }

    async function recheck(zoneId) {
      await fetch(API + "/recheck", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ zoneId }) });
      load();
    }
    async function sale(sku) {
      const r = await fetch(API + "/sale", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sku, qty: 1 }) }).then(x => x.json());
      if (!r.ok) alert(r.message || "Касса отклонила чек");
      load();
    }
    async function postTransit(id) {
      await fetch(API + "/postTransit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ document: id }) });
      load();
    }
    async function applyOffset() {
      const r = await fetch(API + "/applyOffset", { method: "POST" }).then(x => x.json());
      alert(r.message || "Готово");
      load();
    }
    async function finalize() {
      const r = await fetch(API + "/finalize", { method: "POST" }).then(x => x.json());
      alert(r.message || r.error);
      load();
    }
    async function resetDemo() {
      await fetch(API + "/reset", { method: "POST" });
      load();
    }
    load();
    setInterval(load, 1500);
  </script>
</body>
</html>
